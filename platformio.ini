; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    esphome/ESPAsyncWebServer-esphome @ ^3.4.0
    esphome/AsyncTCP-esphome @ ^2.1.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/Adafruit MPU6050 @ ^2.2.6          ; substitui electroniccats/MPU6050
    adafruit/Adafruit BusIO @ ^1.16.1            ; dependência da Adafruit MPU6050
build_flags =
    -Os
    -ggdb  
    -DCONFIG_LWIP_IP_FORWARD=1
    -DCONFIG_LWIP_IPV4_NAPT=1
    -DIP_NAPT_MAX=16
    -DIP_PORTMAP_MAX=32
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DLOG_LOCAL_LEVEL=ESP_LOG_WARN